name: PR29 repair

on:
  push:
    branches:
      - chore/server-readiness-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/server-readiness-20260906
      - name: Apply deterministic fixes to legacy large files
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/api/app/connectors/configurable_html.py",
              "from app.connectors.base import OpportunityCandidate, RawSourceResult, ValidationResult\n\ndef _container_text",
              "from app.connectors.base import OpportunityCandidate, RawSourceResult, ValidationResult\n\nlogger = logging.getLogger(__name__)\n\ndef _container_text",
          )

          for path in ("apps/api/tests/test_api.py", "apps/api/tests/test_opportunity_serialization.py"):
              replace_once(
                  path,
                  "from app.db.seed import seed  # noqa: E402",
                  "from app.db.seed import seed, seed_default_sources  # noqa: E402",
              )
              replace_once(
                  path,
                  "org = db.scalar(select(Organization).where(Organization.slug == \"convocaradar-local\"))\n        if org and not db.scalar",
                  "org = db.scalar(select(Organization).where(Organization.slug == \"convocaradar-local\"))\n        if org:\n            seed_default_sources(db, org, force=True)\n            db.commit()\n        if org and not db.scalar",
              )

          p = Path("apps/api/tests/test_prod_overlay_pr2.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'assert "docker-compose.prod.yml" in text or "compose.prod" in text, "ci prod asserts must use -f docker-compose.prod.yml"',
              'assert "docker-compose.server.yml" in text, "ci prod asserts must validate the autonomous university server compose"',
          )
          p.write_text(text, encoding="utf-8")

          p = Path("apps/api/tests/test_uniandes.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'assert findeter.source_type == "api", (\n            f"Expected source_type=\'api\', got: {findeter.source_type}"\n        )',
              'assert findeter.source_type == "html", (\n            f"Expected source_type=\'html\' after the resilient sitemap/HTML fallback, got: {findeter.source_type}"\n        )',
          )
          p.write_text(text, encoding="utf-8")
      - name: Commit repair patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/connectors/configurable_html.py \
                  apps/api/tests/test_api.py \
                  apps/api/tests/test_opportunity_serialization.py \
                  apps/api/tests/test_prod_overlay_pr2.py \
                  apps/api/tests/test_uniandes.py
          git commit -m "fix(ci): stabilize legacy regression fixtures"
          git push origin HEAD:chore/server-readiness-20260906
