name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint:web

      - name: Build
        run: pnpm run build:web

      - name: Tests
        run: pnpm run test:web

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install --force-reinstall -e ".[dev]"

      - name: Test full API suite
        run: python -m pytest -q
        env:
          DATABASE_URL: sqlite:///./ci_convocaradar.db
          JWT_SECRET: ci_jwt_secret_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          INTERNAL_API_KEY: ci_internal_api_key_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOOTSTRAP_SOURCES_ON_STARTUP: "false"
          RESET_TOKEN_SECRET: ci_reset_secret_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  e2e:
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure isolated Docker environment
        run: |
          cp .env.example .env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=local/' .env
          sed -i 's/^LLM_API_KEY=.*/LLM_API_KEY=/' .env

      - name: Start application
        run: docker compose up -d --build --wait

      - name: Seed E2E administrator
        run: docker compose exec -T -e E2E_ADMIN_PASSWORD='ConvocaRadarLocal123!' api convocaradar-seed-admin --email admin@convocaradar.io --password-env E2E_ADMIN_PASSWORD --force

      - name: Install browser tests
        working-directory: apps/web
        run: npm install && npx playwright install --with-deps chromium

      - name: Run complete E2E suite
        working-directory: apps/web
        run: npm run test:e2e

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application
        if: always()
        run: docker compose down -v
