name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/api/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/backup/Dockerfile
          config: .hadolint.yaml

  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development compose
        run: |
          cp .env.example .env
          docker compose config > /dev/null
        env:
          POSTGRES_PASSWORD: ci-dummy-postgres-password-0123456789abcdef
          MINIO_ROOT_PASSWORD: ci-dummy-minio-root-password-0123456789abcdef
          INTERNAL_API_KEY: ci-dummy-internal-api-key-0123456789abcdef
      - name: Validate university server compose
        run: |
          cp .env.production.example .env
          docker compose -p convocaradar --env-file .env -f docker-compose.server.yml config > /dev/null
        env:
          POSTGRES_PASSWORD: ci-dummy-postgres-password-0123456789abcdef
          MINIO_ROOT_PASSWORD: ci-dummy-minio-root-password-0123456789abcdef
          INTERNAL_API_KEY: ci-dummy-internal-api-key-0123456789abcdef

  prod-asserts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert university server isolation and hardening
        run: |
          cp .env.production.example .env
          docker compose -p convocaradar --env-file .env -f docker-compose.server.yml config --format json > /tmp/server-config.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/server-config.json").read_text())
          services = config["services"]

          internal_services = ("postgres", "minio", "api", "worker", "backup")
          for name in internal_services:
              ports = services[name].get("ports") or []
              assert not ports, f"{name} must not publish host ports in server compose: {ports}"

          web_ports = services["web"].get("ports") or []
          assert len(web_ports) == 1, f"web must publish exactly one port: {web_ports}"
          port = web_ports[0]
          assert str(port.get("target")) == "3000", port
          assert str(port.get("published")) == "3001", port
          assert port.get("host_ip") == "127.0.0.1", port

          for name in ("api", "worker", "backup", "web"):
              svc = services[name]
              assert svc.get("read_only") is True, f"{name}: read_only missing"
              assert "ALL" in (svc.get("cap_drop") or []), f"{name}: cap_drop ALL missing"
              assert any("no-new-privileges" in item for item in (svc.get("security_opt") or [])), (
                  f"{name}: no-new-privileges missing"
              )
              assert svc.get("restart") in ("unless-stopped", "always"), f"{name}: restart policy missing"

          assert services["api"]["depends_on"]["postgres"]["condition"] == "service_healthy"
          assert services["api"]["depends_on"]["minio"]["condition"] == "service_healthy"
          assert services["worker"]["depends_on"]["api"]["condition"] == "service_healthy"
          assert services["backup"]["depends_on"]["postgres"]["condition"] == "service_healthy"
          print("server production assertions PASS")
          PY
        env:
          POSTGRES_PASSWORD: ci-dummy-postgres-password-0123456789abcdef
          MINIO_ROOT_PASSWORD: ci-dummy-minio-root-password-0123456789abcdef
          INTERNAL_API_KEY: ci-dummy-internal-api-key-0123456789abcdef

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Ruff executable-correctness gate
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q --tb=short
        env:
          JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          INTERNAL_API_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @convocaradar/web lint
      - run: pnpm --filter @convocaradar/web exec tsc --noEmit
      - run: pnpm --filter @convocaradar/web exec vitest run --reporter=dot

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-dummy-postgres-password-0123456789abcdef
      MINIO_ROOT_PASSWORD: ci-dummy-minio-root-password-0123456789abcdef
      INTERNAL_API_KEY: ci-dummy-internal-api-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret smoke environment
        run: cp .env.example .env
      - run: docker compose build api
      - run: docker compose up -d postgres minio
      - run: sleep 10 && docker compose up -d api
      - run: sleep 15 && curl -sf http://localhost:8002/api/v1/health/live

  server-smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: convocaradar-ci
      COMPOSE_FILE: docker-compose.server.yml
    steps:
      - uses: actions/checkout@v4

      - name: Prepare production-like non-secret environment
        run: |
          cp .env.production.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres-password-0123456789abcdef|' .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql+psycopg://convocaradar:ci-postgres-password-0123456789abcdef@postgres:5432/convocaradar|' .env
          sed -i 's|^MINIO_ROOT_PASSWORD=.*|MINIO_ROOT_PASSWORD=ci-minio-password-0123456789abcdef|' .env
          sed -i 's|^S3_SECRET_KEY=.*|S3_SECRET_KEY=ci-minio-password-0123456789abcdef|' .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef|' .env
          sed -i 's|^INTERNAL_API_KEY=.*|INTERNAL_API_KEY=ci-internal-api-key-0123456789abcdef0123456789abcdef|' .env
          sed -i 's|^RESET_TOKEN_SECRET=.*|RESET_TOKEN_SECRET=ci-reset-token-secret-0123456789abcdef0123456789abcdef|' .env
          sed -i 's|^BOOTSTRAP_SOURCES_ON_STARTUP=.*|BOOTSTRAP_SOURCES_ON_STARTUP=false|' .env
          sed -i 's|^WEB_PORT=.*|WEB_PORT=3001|' .env
          docker compose --env-file .env config > /dev/null

      - name: Start stateful services and wait for health
        run: |
          docker compose --env-file .env up -d postgres minio
          for service in postgres minio; do
            cid="$(docker compose --env-file .env ps -q "$service")"
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format='{{.State.Health.Status}}' "$cid")"
              [ "$status" = healthy ] && break
              [ "$attempt" -eq 40 ] && { docker compose --env-file .env logs "$service"; exit 1; }
              sleep 2
            done
          done

      - name: Prove PostgreSQL volume survives container recreation
        run: |
          docker compose --env-file .env exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U convocaradar -d convocaradar \
            -c 'CREATE TABLE ci_persistence_probe (id integer PRIMARY KEY); INSERT INTO ci_persistence_probe VALUES (1);'
          docker compose --env-file .env up -d --force-recreate postgres
          cid="$(docker compose --env-file .env ps -q postgres)"
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$cid")"
            [ "$status" = healthy ] && break
            [ "$attempt" -eq 40 ] && { docker compose --env-file .env logs postgres; exit 1; }
            sleep 2
          done
          test "$(docker compose --env-file .env exec -T postgres psql -U convocaradar -d convocaradar -tAc 'SELECT count(*) FROM ci_persistence_probe WHERE id = 1' | tr -d '\r')" = "1"
          docker compose --env-file .env exec -T postgres psql -v ON_ERROR_STOP=1 -U convocaradar -d convocaradar -c 'DROP TABLE ci_persistence_probe;'

      - name: Start production application stack
        run: |
          docker compose --env-file .env up -d --build api worker backup web
          for service in api worker web; do
            cid="$(docker compose --env-file .env ps -q "$service")"
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format='{{.State.Health.Status}}' "$cid")"
              [ "$status" = healthy ] && break
              [ "$attempt" -eq 60 ] && { docker compose --env-file .env logs "$service"; exit 1; }
              sleep 3
            done
          done
          curl -fsS http://127.0.0.1:3001/ > /dev/null

      - name: Prove clean Alembic migration reached head
        run: |
          docker compose --env-file .env exec -T api alembic current | tee /tmp/alembic-current.txt
          grep -q '(head)' /tmp/alembic-current.txt
          test "$(docker compose --env-file .env exec -T postgres psql -U convocaradar -d convocaradar -tAc "SELECT to_regclass('public.opportunities') IS NOT NULL" | tr -d '\r')" = "t"

      - name: Execute and verify real backup cycle
        run: |
          docker compose --env-file .env exec -T backup /scripts/backup-cycle.sh
          docker compose --env-file .env exec -T backup /scripts/verify_latest_backup.sh /backups
          docker compose --env-file .env exec -T backup sh -c 'test -n "$(ls -t /backups/convocaradar-*.sql.gz 2>/dev/null | head -n 1)"'

      - name: Restore newest backup into scratch database and compare schema
        run: |
          latest="$(docker compose --env-file .env exec -T backup sh -c 'ls -t /backups/convocaradar-*.sql.gz | head -n 1' | tr -d '\r')"
          test -n "$latest"
          docker compose --env-file .env exec -T postgres createdb -U convocaradar scratch_restore
          docker compose --env-file .env exec -T backup sh -c "gzip -dc '$latest'" \
            | docker compose --env-file .env exec -T postgres \
                psql -v ON_ERROR_STOP=1 -U convocaradar -d scratch_restore
          source_revision="$(docker compose --env-file .env exec -T postgres psql -U convocaradar -d convocaradar -tAc 'SELECT version_num FROM alembic_version' | tr -d '\r')"
          restored_revision="$(docker compose --env-file .env exec -T postgres psql -U convocaradar -d scratch_restore -tAc 'SELECT version_num FROM alembic_version' | tr -d '\r')"
          test "$source_revision" = "$restored_revision"
          source_tables="$(docker compose --env-file .env exec -T postgres psql -U convocaradar -d convocaradar -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'" | tr -d '\r')"
          restored_tables="$(docker compose --env-file .env exec -T postgres psql -U convocaradar -d scratch_restore -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'" | tr -d '\r')"
          test "$source_tables" = "$restored_tables"
          test "$(docker compose --env-file .env exec -T postgres psql -U convocaradar -d scratch_restore -tAc "SELECT to_regclass('public.opportunities') IS NOT NULL" | tr -d '\r')" = "t"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color

      - name: Remove disposable smoke stack
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans
