name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/api/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
          config: .hadolint.yaml

  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config > /dev/null
        env:
          POSTGRES_PASSWORD: ci-dummy-postgres-password-0123456789abcdef
          MINIO_ROOT_PASSWORD: ci-dummy-minio-root-password-0123456789abcdef
          INTERNAL_API_KEY: ci-dummy-internal-api-key-0123456789abcdef

  prod-asserts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Validating prod overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml config"
          POSTGRES_PASSWORD=ci-dummy-postgres-password-0123456789abcdef \
          MINIO_ROOT_PASSWORD=ci-dummy-minio-root-password-0123456789abcdef \
          INTERNAL_API_KEY=ci-dummy-internal-api-key-0123456789abcdef \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /tmp/prod-config.yml
          echo "Checking port isolation — 5434:5432 must NOT appear in prod config"
          if grep -q "5434:5432" /tmp/prod-config.yml; then echo "FAIL: prod config still exposes 5434:5432" >&2; exit 1; fi
          if grep -q "9004:9000" /tmp/prod-config.yml; then echo "FAIL: prod config still exposes 9004:9000" >&2; exit 1; fi
          echo "Checking hardening present"
          grep -q "cap_drop" /tmp/prod-config.yml || (echo "FAIL: cap_drop missing in prod config" >&2; exit 1)
          grep -q "no-new-privileges" /tmp/prod-config.yml || (echo "FAIL: no-new-privileges missing" >&2; exit 1)
          grep -q "read_only" /tmp/prod-config.yml || (echo "FAIL: read_only missing in prod config" >&2; exit 1)
          echo "prod-asserts PASS"
        env:
          POSTGRES_PASSWORD: ci-dummy-postgres-password-0123456789abcdef
          MINIO_ROOT_PASSWORD: ci-dummy-minio-root-password-0123456789abcdef
          INTERNAL_API_KEY: ci-dummy-internal-api-key-0123456789abcdef

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q --tb=short
        env:
          JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          INTERNAL_API_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

  # Frontend gate: lint, type-check, and unit tests. e2e (Playwright) is
  # run separately so a long-running browser job does not block PR feedback.
  # The workspace is pnpm-managed (pnpm-workspace.yaml + root lockfile);
  # install runs from the repo root so --frozen-lockfile validates the
  # single shared lockfile.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @convocaradar/web lint
      - run: pnpm --filter @convocaradar/web exec tsc --noEmit
      - run: pnpm --filter @convocaradar/web exec vitest run --reporter=dot

  docker:
    runs-on: ubuntu-latest
    # docker-compose.yml hard-fails via ${VAR:?must be set}; provide dummy
    # values so the smoke stack can come up on a fresh checkout.
    env:
      POSTGRES_PASSWORD: ci-dummy-postgres-password-0123456789abcdef
      MINIO_ROOT_PASSWORD: ci-dummy-minio-root-password-0123456789abcdef
      INTERNAL_API_KEY: ci-dummy-internal-api-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api
      - run: docker compose up -d postgres minio
      - run: sleep 10 && docker compose up -d api
      # Compose maps the api service 8002:8000; /api/v1/health/live matches
      # the container's own healthcheck path.
      - run: sleep 15 && curl -sf http://localhost:8002/api/v1/health/live
