name: PR29 diagnostics

on:
  push:
    branches:
      - chore/server-readiness-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dev dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Capture Ruff output
        working-directory: apps/api
        shell: bash
        run: |
          set +e
          ruff check . > "$RUNNER_TEMP/ruff.txt" 2>&1
          echo $? > "$RUNNER_TEMP/ruff.exit"
          ruff format --check . > "$RUNNER_TEMP/ruff-format.txt" 2>&1
          echo $? > "$RUNNER_TEMP/ruff-format.exit"
          exit 0
      - name: Capture pytest output
        working-directory: apps/api
        shell: bash
        env:
          JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          INTERNAL_API_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          set +e
          pytest tests/ -q --tb=short > "$RUNNER_TEMP/pytest.txt" 2>&1
          echo $? > "$RUNNER_TEMP/pytest.exit"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr29-python-diagnostics
          path: |
            ${{ runner.temp }}/ruff.txt
            ${{ runner.temp }}/ruff.exit
            ${{ runner.temp }}/ruff-format.txt
            ${{ runner.temp }}/ruff-format.exit
            ${{ runner.temp }}/pytest.txt
            ${{ runner.temp }}/pytest.exit
          if-no-files-found: error

  docker-diagnostics:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-dummy-postgres-password-0123456789abcdef
      MINIO_ROOT_PASSWORD: ci-dummy-minio-root-password-0123456789abcdef
      INTERNAL_API_KEY: ci-dummy-internal-api-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke stack and capture diagnostics
        shell: bash
        run: |
          set +e
          cp .env.example .env
          docker compose build api > "$RUNNER_TEMP/docker-build.txt" 2>&1
          docker compose up -d postgres minio > "$RUNNER_TEMP/docker-up-deps.txt" 2>&1
          sleep 10
          docker compose up -d api > "$RUNNER_TEMP/docker-up-api.txt" 2>&1
          sleep 15
          curl -sv http://localhost:8002/api/v1/health/live > "$RUNNER_TEMP/curl.txt" 2>&1
          echo $? > "$RUNNER_TEMP/curl.exit"
          docker compose ps -a > "$RUNNER_TEMP/docker-ps.txt" 2>&1
          docker compose logs --no-color api > "$RUNNER_TEMP/api.log" 2>&1
          docker compose logs --no-color postgres > "$RUNNER_TEMP/postgres.log" 2>&1
          docker compose logs --no-color minio > "$RUNNER_TEMP/minio.log" 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr29-docker-diagnostics
          path: |
            ${{ runner.temp }}/docker-build.txt
            ${{ runner.temp }}/docker-up-deps.txt
            ${{ runner.temp }}/docker-up-api.txt
            ${{ runner.temp }}/curl.txt
            ${{ runner.temp }}/curl.exit
            ${{ runner.temp }}/docker-ps.txt
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/postgres.log
            ${{ runner.temp }}/minio.log
          if-no-files-found: error
