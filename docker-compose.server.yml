# ConvocaRadar IA — standalone production compose for the university VM.
# This file intentionally does NOT extend docker-compose.yml: production must
# not inherit development port mappings by Compose merge semantics.
#
# Usage:
#   docker compose -p convocaradar --env-file .env -f docker-compose.server.yml config
#   docker compose -p convocaradar --env-file .env -f docker-compose.server.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: convocaradar
      POSTGRES_USER: convocaradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convocaradar -d convocaradar"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must be set}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://convocaradar:${POSTGRES_PASSWORD:?must be set}@postgres:5432/convocaradar
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?must be set}
      S3_BUCKET: ${S3_BUCKET:-convocaradar}
      S3_REGION: ${S3_REGION:-auto}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?must be set}
      SCHEDULER_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /home/app/.cache:size=128M,uid=1001,gid=1001,mode=0700
      - /home/app/.config:size=32M,uid=1001,gid=1001,mode=0700
    mem_limit: 1500m
    cpus: 1.5

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://convocaradar:${POSTGRES_PASSWORD:?must be set}@postgres:5432/convocaradar
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?must be set}
      S3_BUCKET: ${S3_BUCKET:-convocaradar}
      S3_REGION: ${S3_REGION:-auto}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?must be set}
      BOOTSTRAP_SOURCES_ON_STARTUP: "false"
      SCHEDULER_ENABLED: "true"
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time,sys; p=pathlib.Path('/tmp/convocaradar-worker.heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 45 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /home/app/.cache:size=128M,uid=1001,gid=1001,mode=0700
      - /home/app/.config:size=32M,uid=1001,gid=1001,mode=0700
    mem_limit: 1500m
    cpus: 1.5

  backup:
    build:
      context: .
      dockerfile: apps/backup/Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_USER: convocaradar
      POSTGRES_DB: convocaradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32M,mode=1777
    mem_limit: 256m
    cpus: 0.5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_ENV: production
        NEXT_PUBLIC_ENABLE_WAKE_RETRIES: ${NEXT_PUBLIC_ENABLE_WAKE_RETRIES:-true}
    environment:
      INTERNAL_API_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /app/srv/app/.next/cache:size=128M,uid=1001,gid=1001,mode=0755
    mem_limit: 768m
    cpus: 0.75

volumes:
  postgres-data:
  minio-data:
  backups-data: