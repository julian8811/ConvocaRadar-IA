services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: convocaradar
      POSTGRES_USER: convocaradar
      POSTGRES_PASSWORD: convocaradar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convocaradar -d convocaradar"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://convocaradar:convocaradar@postgres:5432/convocaradar
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?must be set}
      BOOTSTRAP_SOURCES_ON_STARTUP: "true"
      SCRAPING_MAX_CONCURRENCY: "2"
      SCRAPING_TIMEOUT_SECONDS: "120"
      SCRAPING_MAX_SOURCE_SECONDS: "180"
      SCHEDULER_ENABLED: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://convocaradar:${POSTGRES_PASSWORD:-convocaradar}@postgres:5432/convocaradar
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?must be set}
      BOOTSTRAP_SOURCES_ON_STARTUP: "false"
      SCRAPING_MAX_CONCURRENCY: "2"
      SCRAPING_TIMEOUT_SECONDS: "120"
      SCRAPING_MAX_SOURCE_SECONDS: "180"
      SCHEDULER_ENABLED: "true"
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time,sys; p=pathlib.Path('/tmp/convocaradar-worker.heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 45 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    depends_on:
      api:
        # Wait for the API container to be healthy, not just started. The
        # worker shares the API image but its real dependency is the database
        # schema being migrated by the API on boot.
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      # Service discovery via Docker network — not localhost (that would
      # resolve to the web container itself, not the API).
      NEXT_PUBLIC_API_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
